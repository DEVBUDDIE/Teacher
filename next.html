<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Manish Sir</title>
    <style>
        :root {
            --bg-dark: #050505;
            --accent: #ffd700;
            --text-light: #ffffff;
            --glass-bg: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-light);
            overflow: hidden;
        }

       
        #landscape-warning {
            display: none;
            position: absolute;
            inset: 0;
            background: #000;
            z-index: 99999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        #landscape-warning h1 { font-size: 2rem; color: #fff; margin-bottom: 10px; }
        #landscape-warning p { font-size: 1.2rem; color: #aaa; }
        #landscape-warning .rotate-icon { font-size: 4rem; margin-bottom: 20px; animation: rotatePhone 2s infinite ease-in-out; }

        @keyframes rotatePhone {
            0% { transform: rotate(-90deg); }
            50% { transform: rotate(0deg); }
            100% { transform: rotate(-90deg); }
        }

        @media screen and (max-width: 900px) and (orientation: landscape) {
            #landscape-warning { display: flex !important; }
            .app-container { display: none !important; }
        }

       
        .app-container {
            width: 100%;
            max-width: 420px;
            height: 100%;
            max-height: 900px;
            background-color: #000;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.1);
            overflow: hidden;
        }

        
        .video-container {
            position: absolute;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #050505;
            z-index: 10;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.95);
            transition: filter 1s ease-in-out;
            will-change: filter;
        }

        video.dimmed-for-text {
            filter: brightness(0.25) contrast(1.2) blur(3px);
        }

       
        .error-overlay {
            position: absolute;
            inset: 0;
            background: #1a0505;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
            z-index: 50;
            opacity: 0;
            pointer-events: none;
        }
        .error-overlay.active { opacity: 1; pointer-events: all; }
        .error-overlay span { font-size: 3rem; margin-bottom: 10px; }
        .error-overlay h3 { color: #ff4757; margin-bottom: 10px; }
        .error-overlay p { color: #ccc; font-size: 0.9rem; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 8px;}

       
        .start-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 40;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.6s ease;
        }

        .start-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .play-btn {
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            color: #000;
            border: none;
            padding: 18px 40px;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.4);
            animation: pulsePlay 2s infinite;
        }

        @keyframes pulsePlay {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 215, 0, 0.5); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 20px rgba(255, 215, 0, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 215, 0, 0); }
        }

        
        .skip-btn {
            position: absolute;
            top: 25px;
            right: 25px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            z-index: 35;
            transition: background 0.2s, transform 0.2s;
        }
        .skip-btn:active { transform: scale(0.95); background: rgba(255, 255, 255, 0.3); }
        .skip-btn.hidden { opacity: 0; pointer-events: none; }

                .theme-controls {
            position: absolute;
            bottom: 0;
            width: 100%;
            padding: 40px 25px 25px 25px;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 10%, transparent);
            z-index: 20;
            display: flex;
            flex-direction: column;
            opacity: 0;
            transition: opacity 1s ease;
        }
        .theme-controls.active { opacity: 1; }

        .progress-bg {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: var(--accent);
            border-radius: 4px;
            transition: width 0.1s linear;
        }

                .ending-screen {
            position: absolute;
            inset: 0;
            z-index: 30;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
            pointer-events: none;
            perspective: 1000px;
        }

        .glass-card-end {
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 28px;
            border: 1px solid var(--glass-border);
            box-shadow: 
                0 30px 60px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.15),
                inset 0 0 20px rgba(255, 255, 255, 0.02);
            padding: 35px 25px;
            text-align: left;
            
            opacity: 0;
            transform: scale(0.5) rotateX(25deg);
            filter: blur(15px);
            transition: all 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            will-change: transform, opacity, filter;
        }

        .ending-screen.active { pointer-events: all; }
        .ending-screen.active .glass-card-end {
            opacity: 1;
            transform: scale(1) rotateX(0deg);
            filter: blur(0);
        }

        .deep-message {
            font-size: 1.05rem;
            line-height: 1.6;
            color: #f1f5f9;
            font-weight: 500;
            text-shadow: 0 2px 8px rgba(0,0,0,0.6);
            white-space: pre-wrap;
        }

        .cursor {
            display: inline-block;
            width: 3px;
            height: 1.15rem;
            background-color: var(--accent);
            vertical-align: middle;
            margin-left: 3px;
            animation: blink 0.8s infinite;
            border-radius: 2px;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .dev-credit {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
            letter-spacing: 3px;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 15px;
            margin-top: 20px;
            text-align: center;
            opacity: 0;
            transition: opacity 0.8s ease;
        }
        .dev-credit.visible { opacity: 1; }
        .dev-credit span { 
            color: var(--accent); 
            font-weight: 800; 
            letter-spacing: 1px;
        }

        
        .billboard-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.92);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .billboard-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .billboard-content {
            transform: scale(0.85);
            transition: transform 1.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .billboard-overlay.active .billboard-content {
            transform: scale(1);
        }

        .billboard-title {
            font-size: 2.2rem;
            font-weight: 900;
            color: #fff;
            line-height: 1.3;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.4);
        }

        .billboard-title span {
            color: var(--accent);
            display: block;
            font-size: 2.6rem;
            margin-top: 5px;
            text-shadow: 0 0 40px rgba(255, 215, 0, 0.6);
        }

        .billboard-signer {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 4px;
            text-transform: uppercase;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div id="landscape-warning">
        <div class="rotate-icon">📱</div>
        <h1>Arey Sir! 😅</h1>
        <p>Phone seedha kar lo (Portrait mode).<br>Cinematic view ke liye seedha pakdo!</p>
    </div>

    <div class="app-container">
        
        <button class="skip-btn hidden" id="skipBtn" onclick="triggerCinematicMessage()">Skip ⏭️</button>

        <div class="video-container">
                       <video id="mainVideo" playsinline preload="auto">
                <source src="banana.mp4" type="video/mp4">
            </video>
            
            <div class="error-overlay" id="errorOverlay">
                <span>⚠️</span>
                <h3>File Missing!</h3>
                <p>Nahi mila bhai!<br>Ensure <b>"banana.mp4"</b> is in this exact folder.</p>
            </div>
        </div>

        <div class="start-overlay" id="startOverlay">
            <button class="play-btn" onclick="startFinale()">Play Finale ▶</button>
        </div>

        <div class="theme-controls" id="themeControls">
            <div class="progress-bg">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>

        <div class="ending-screen" id="endingScreen">
            <div class="glass-card-end">
                <p class="deep-message"><span id="typewriter"></span><span class="cursor" id="cursor"></span></p>
                <div class="dev-credit" id="devCredit">Crafted with love by <span>Deepak Singh & 11th batch</span></div>
            </div>
        </div>

        <div class="billboard-overlay" id="billboardOverlay">
            <div class="billboard-content">
                <h1 class="billboard-title">
                    Happy Teachers Day 💐
                    <span>Manish Sir & All</span>
                </h1>
                <div class="billboard-signer">11th Batch</div>
            </div>
        </div>

    </div>

    <script>
        const videoEl = document.getElementById('mainVideo');
        const startOverlay = document.getElementById('startOverlay');
        const themeControls = document.getElementById('themeControls');
        const endingScreen = document.getElementById('endingScreen');
        const errorOverlay = document.getElementById('errorOverlay');
        const skipBtn = document.getElementById('skipBtn');
        const progressFill = document.getElementById('progressFill');
        const typewriterEl = document.getElementById('typewriter');
        const cursorEl = document.getElementById('cursor');
        const devCredit = document.getElementById('devCredit');
        const billboardOverlay = document.getElementById('billboardOverlay');

        let messageTriggered = false;

        const targetText = `Happy Teacher’s Day — To The People Who Shape Our Reality\n\nWe often think a teacher’s job is simply to teach us what is written in a book.\n\nBut the reality is much deeper.\n\nA teacher doesn’t just teach us what to think — they slowly teach us how to think.`;

        function startFinale() {
            startOverlay.classList.add('hidden');
            skipBtn.classList.remove('hidden');
            
            videoEl.play().then(() => {
                themeControls.classList.add('active');
            }).catch(e => {
                console.error("Playback failed", e);
            });
        }

        videoEl.addEventListener('timeupdate', () => {
            if (!videoEl.duration) return;

            const current = videoEl.currentTime;
            const total = videoEl.duration;
            
            progressFill.style.width = `${(current / total) * 100}%`;

           
            const triggerTime = total > 35 ? 62 : total * 0.7;
            if (current >= triggerTime && !messageTriggered) {
                triggerCinematicMessage();
            }
        });

        videoEl.addEventListener('ended', () => {
            if (!messageTriggered) {
                triggerCinematicMessage();
            }
        });

        function triggerCinematicMessage() {
            if (messageTriggered) return;
            messageTriggered = true;
            
            skipBtn.classList.add('hidden');
            themeControls.style.opacity = '0';
            videoEl.classList.add('dimmed-for-text');
            endingScreen.classList.add('active');

            let charIndex = 0;
            const typingSpeed = 35; 
            function typeStep() {
                if (charIndex < targetText.length) {
                    typewriterEl.textContent += targetText.charAt(charIndex);
                    charIndex++;
                    setTimeout(typeStep, typingSpeed);
                } else {
                    cursorEl.style.display = 'none';
                    devCredit.classList.add('visible');

                    setTimeout(() => {
                        endingScreen.style.opacity = '0';
                        endingScreen.style.transition = 'opacity 1s ease';
                        billboardOverlay.classList.add('active');
                    }, 3500);
                }
            }

            
            setTimeout(typeStep, 600);
        }

        videoEl.addEventListener('error', function() {
            startOverlay.classList.add('hidden');
            skipBtn.classList.add('hidden');
            errorOverlay.classList.add('active');
        });
    </script>
</body>
</html>
